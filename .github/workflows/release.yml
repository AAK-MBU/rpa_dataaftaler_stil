name: Release

# Pushing a tag like v2.1.0 builds Dataaftaler-v2.1.0.zip and attaches it to a
# GitHub release. The tag must match the version in pyproject.toml.
#
# Zip layout:
#   Dataaftaler/
#     Start Dataaftaler.bat   (from packaging/)
#     LÆS MIG.txt             (from packaging/)
#     app/                    (git archive of the repo, minus export-ignore paths)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches pyproject version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | awk -F'"' '{print $2}')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME matcher ikke version $VERSION i pyproject.toml."
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p dist
          git archive --prefix=Dataaftaler/app/ HEAD | tar -x -C dist
          cp packaging/* dist/Dataaftaler/
          # Python's zipfile marks non-ASCII names (LÆS MIG.txt) as UTF-8, which
          # Windows Explorer reads correctly.
          python3 - <<'EOF'
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          root = Path("dist")
          with zipfile.ZipFile(f"Dataaftaler-{tag}.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob("*")):
                  zf.write(path, path.relative_to(root).as_posix())
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Dataaftaler-$GITHUB_REF_NAME.zip" \
            --title "Dataaftaler $GITHUB_REF_NAME" \
            --generate-notes
