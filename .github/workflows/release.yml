name: Release on main

# When a merge lands on main, tag it v<version> from pyproject.toml
# ([project].version), build Dataaftaler-v<version>.zip and publish both as a
# GitHub Release. The job is idempotent: if the tag already exists it is
# skipped, so merges that don't bump the version (or re-runs) do nothing. The
# version bump itself is enforced on the PR by version-gate.yml.
#
# Tag, zip and release are made in this one job on purpose: a tag pushed with
# GITHUB_TOKEN does not trigger other workflows.
#
# Zip layout:
#   Dataaftaler/
#     Start Dataaftaler.bat   (from packaging/)
#     LÆS MIG.txt             (from packaging/)
#     app/                    (git archive of the repo, minus export-ignore paths)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the latest push to main matters; cancel any superseded run.
concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write # create tags and releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags to detect an existing tag

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version $version (tag v$version)"

      - name: Check whether the tag is new
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists — nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.check.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          git archive --prefix=Dataaftaler/app/ HEAD | tar -x -C dist
          cp packaging/* dist/Dataaftaler/
          # Python's zipfile marks non-ASCII names (LÆS MIG.txt) as UTF-8, which
          # Windows Explorer reads correctly.
          python3 - <<'EOF'
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ["TAG"]
          root = Path("dist")
          with zipfile.ZipFile(f"Dataaftaler-{tag}.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob("*")):
                  zf.write(path, path.relative_to(root).as_posix())
          EOF

      - name: Create tag and release
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "::notice::Creating release $TAG at $GITHUB_SHA"
          gh release create "$TAG" "Dataaftaler-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "Dataaftaler $TAG" \
            --generate-notes
