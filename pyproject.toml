[project]
name = "rpa-dataaftaler-stil"
version = "0.1.0"
description = "Desktop RPA-løsning til at danne overblik over og opdatere dataaftaler i STIL, bygget på ATS-frameworket med et Tkinter-feedbackvindue."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client @ git+https://github.com/odense-rpa/automation-server-client.git",
    "mbu-dev-shared-components>=3.0.0",
    "mbu-rpa-core",
    "pillow",
    "ruff",
    "selenium>=4.23",
    "pandas",
    "openpyxl",
    "requests",
    "python-dotenv",
]

[project.scripts]
# Console entry point: after `uv sync`, run the app with `uv run dataaftaler`.
dataaftaler = "gui.app:main"

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.2.0" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: one top-level module (main) plus the package directories.
py-modules = ["main"]
packages = ["gui", "helpers", "processes"]

[tool.ruff]
target-version = "py313"
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  "uv.lock",
  ".env",
]

[tool.ruff.lint]
ignore = ["E501", "E251"]
select = [
  "F",    # Pyflakes
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "I",    # isort (import sorting)
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "TC",   # flake8-type-checking
  "ARG",  # flake8-unused-arguments
  "DTZ",  # enforce timezone-aware datetimes
  "SIM",  # flake8-simplify
  "PL",   # pylint (subset)
]

[tool.ruff.lint.isort]
# Keep imports tidy and deterministic
# known-first-party = ["your_package_name"]

[tool.ruff.format]
# Use the formatter; CI step already checks it with `ruff format --check .`

[tool.pyright]
include = ["."]
exclude = [
  "venv",
  ".venv",
  "build",
  "dist",
  "__pycache__"
]
pythonVersion = "3.13"
typeCheckingMode = "basic"   # or "basic"
reportMissingTypeStubs = true
